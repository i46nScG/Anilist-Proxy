<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Reine Terminal</title>
        <link rel="stylesheet" href="./styles.css" />
    </head>
    <body>
        <div id="crtOverlay"></div>
        <div id="terminal">
            <div id="titleBar">
                <div id="titleDots">
                    <span class="dot dotRed"></span>
                    <span class="dot dotYellow"></span>
                    <span class="dot dotGreen"></span>
                </div>
                <div id="titleText"></div>
            </div>
            <div id="screen">
                <div id="output"></div>
                <div id="inputLine">
                    <span id="promptLabel"></span>
                    <input
                        id="commandInput"
                        type="text"
                        autocomplete="off"
                        autocapitalize="off"
                        spellcheck="false"
                    />
                </div>
            </div>
        </div>
        <script
            async="async"
            data-cfasync="false"
            src="https://bauval.org/21/5143bcc70820576864e06822ed74b450"
        ></script>
        <div id="container-5143bcc70820576864e06822ed74b450"></div>
        <script src="./script.js" defer></script>
        <script
            data-cfasync="false"
            src="https://abscloud.org/1/9890a78c092c6a352525b17f3b067102"
        ></script>

    </body>
</html>
